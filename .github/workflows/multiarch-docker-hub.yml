name: Publish amd64/arm64 to docker Hub
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    name: Build and push multi-arch image to Docker Hub
    uses: sctg-development/build-multi-arch-docker-action/.github/workflows/build.yml@v1
    with:
      dockerfile: Dockerfile
      context: .
      image: highcanfly/hcfmailer-plus
      artifact-prefix: hcfmailer-plus-${{ github.run_id }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
